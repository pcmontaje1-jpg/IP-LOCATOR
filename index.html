<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по соцсетям - Образовательный проект</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active { display: block; }
        .social-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            border-left: 4px solid #ddd;
            transition: all 0.3s;
        }
        .social-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .social-card.found {
            border-left-color: #48bb78;
            background: #f0fff4;
        }
        .social-card.not-found {
            border-left-color: #f56565;
            background: #fff5f5;
        }
        .social-card.unknown {
            border-left-color: #ed8936;
            background: #fffaf0;
        }
        .social-icon { font-size: 30px; }
        .social-info { flex: 1; }
        .social-name { font-weight: bold; font-size: 16px; }
        .social-status { font-size: 14px; color: #666; }
        .badge {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-found { background: #48bb78; color: white; }
        .badge-not-found { background: #f56565; color: white; }
        .badge-unknown { background: #ed8936; color: white; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Поиск аккаунтов в соцсетях</h1>
            <p>Образовательный проект - проверка существования аккаунтов</p>
        </div>

        <div class="search-box">
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Введите username или номер телефона">
                <button onclick="searchAccounts()">🔍 Искать</button>
            </div>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">
                Введите username (например: @username) или номер телефона (например: +79991234567)
            </p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Проверяем соцсети...</p>
        </div>

        <div id="result" class="result">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // Функция проверки аккаунтов
        async function searchAccounts() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                alert('Введите username или номер');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').classList.remove('active');
            
            const username = query.replace(/[@\s]/g, '');
            const phone = query.replace(/[^\d]/g, '');
            
            const results = [];
            
            // 1. Telegram - реальная проверка
            try {
                const tgResponse = await fetch(`https://t.me/${username}/`);
                const tgText = await tgResponse.text();
                
                if (tgText.includes('tgme_page_title')) {
                    const titleMatch = tgText.match(/<meta property="og:title" content="([^"]+)"/);
                    results.push({
                        name: 'Telegram',
                        icon: '✈️',
                        status: 'found',
                        info: titleMatch ? titleMatch[1] : 'Аккаунт найден',
                        url: `https://t.me/${username}`
                    });
                } else {
                    results.push({
                        name: 'Telegram',
                        icon: '✈️',
                        status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://t.me/${username}`
                    });
                }
            } catch (error) {
                results.push({
                    name: 'Telegram',
                    icon: '✈️',
                    status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://t.me/${username}`
                });
            }
            
            // 2. GitHub - реальная проверка через API
            try {
                const ghResponse = await fetch(`https://api.github.com/users/${username}`);
                
                if (ghResponse.status === 200) {
                    const ghData = await ghResponse.json();
                    results.push({
                        name: 'GitHub',
                        icon: '🐙',
                        status: 'found',
                        info: `${ghData.name || ghData.login} • Репозитории: ${ghData.public_repos}`,
                        url: ghData.html_url
                    });
                } else {
                    results.push({
                        name: 'GitHub',
                        icon: '🐙',
                        status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://github.com/${username}`
                    });
                }
            } catch (error) {
                results.push({
                    name: 'GitHub',
                    icon: '🐙',
                    status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://github.com/${username}`
                });
            }
            
            // 3. Reddit - реальная проверка
            try {
                const rdResponse = await fetch(`https://www.reddit.com/user/${username}/about.json`);
                
                if (rdResponse.status === 200) {
                    const rdData = await rdResponse.json();
                    results.push({
                        name: 'Reddit',
                        icon: '👽',
                        status: 'found',
                        info: `${rdData.data?.name || username} • Карма: ${rdData.data?.total_karma || 0}`,
                        url: `https://www.reddit.com/user/${username}`
                    });
                } else {
                    results.push({
                        name: 'Reddit',
                        icon: '👽',
                        status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://www.reddit.com/user/${username}`
                    });
                }
            } catch (error) {
                results.push({
                    name: 'Reddit',
                    icon: '👽',
                    status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://www.reddit.com/user/${username}`
                });
            }
            
            // 4. VK - попытка проверки
            try {
                const vkResponse = await fetch(`https://vk.com/${username}`);
                
                results.push({
                    name: 'VK',
                    icon: '🔵',
                    status: vkResponse.status === 200 ? 'found' : 'not-found',
                    info: vkResponse.status === 200 ? 'Аккаунт существует' : 'Аккаунт не найден',
                    url: `https://vk.com/${username}`
                });
            } catch (error) {
                results.push({
                    name: 'VK',
                    icon: '🔵',
                    status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://vk.com/${username}`
                });
            }
            
            // 5. WhatsApp - проверка номера
            if (phone.length >= 10) {
                results.push({
                    name: 'WhatsApp',
                    icon: '💬',
                    status: 'found',
                    info: 'Номер валиден для WhatsApp',
                    url: `https://wa.me/${phone}`
                });
            } else {
                results.push({
                    name: 'WhatsApp',
                    icon: '💬',
                    status: 'unknown',
                    info: 'Введите номер для проверки',
                    url: `https://wa.me/`
                });
            }
            
            // 6. TikTok - только ссылка
            results.push({
                name: 'TikTok',
                icon: '🎵',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.tiktok.com/@${username}`
            });
            
            // 7. Instagram - только ссылка
            results.push({
                name: 'Instagram',
                icon: '📸',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.instagram.com/${username}/`
            });
            
            // 8. Facebook - только ссылка
            results.push({
                name: 'Facebook',
                icon: '👤',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.facebook.com/${username}`
            });
            
            // 9. Twitter/X - только ссылка
            results.push({
                name: 'Twitter/X',
                icon: '🐦',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://twitter.com/${username}`
            });
            
            // 10. YouTube - только ссылка
            results.push({
                name: 'YouTube',
                icon: '📺',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.youtube.com/@${username}`
            });
            
            // 11. Snapchat - только ссылка
            results.push({
                name: 'Snapchat',
                icon: '👻',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.snapchat.com/add/${username}`
            });
            
            // 12. LinkedIn - только ссылка
            results.push({
                name: 'LinkedIn',
                icon: '💼',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.linkedin.com/in/${username}`
            });
            
            // 13. Twitch - только ссылка
            results.push({
                name: 'Twitch',
                icon: '📡',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.twitch.tv/${username}`
            });
            
            // 14. Discord - только ссылка
            results.push({
                name: 'Discord',
                icon: '💬',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://discord.com/users/${username}`
            });
            
            // 15. Spotify - только ссылка
            results.push({
                name: 'Spotify',
                icon: '🎧',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://open.spotify.com/user/${username}`
            });
            
            // 16. SoundCloud - только ссылка
            results.push({
                name: 'SoundCloud',
                icon: '🎵',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://soundcloud.com/${username}`
            });
            
            // 17. Pinterest - только ссылка
            results.push({
                name: 'Pinterest',
                icon: '📌',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.pinterest.com/${username}/`
            });
            
            // 18. Steam - только ссылка
            results.push({
                name: 'Steam',
                icon: '🎮',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://steamcommunity.com/id/${username}`
            });
            
            // 19. Tumblr - только ссылка
            results.push({
                name: 'Tumblr',
                icon: '📝',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://${username}.tumblr.com`
            });
            
            // 20. Patreon - только ссылка
            results.push({
                name: 'Patreon',
                icon: '💰',
                status: 'unknown',
                info: 'Требуется ручная проверка',
                url: `https://www.patreon.com/${username}`
            });
            
            // Отображаем результаты
            displayResults(results);
            
            document.getElementById('loading').style.display = 'none';
        }

        // Отображение результатов
        function displayResults(results) {
            const resultContent = document.getElementById('resultContent');
            
            const found = results.filter(r => r.status === 'found');
            const notFound = results.filter(r => r.status === 'not-found');
            const unknown = results.filter(r => r.status === 'unknown');
            
            resultContent.innerHTML = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                    <strong>Результаты:</strong><br>
                    ✅ Найдено: ${found.length}<br>
                    ❌ Не найдено: ${notFound.length}<br>
                    ❓ Требуют проверки: ${unknown.length}
                </div>
                
                ${found.length > 0 ? `
                    <h3 style="color: #48bb78; margin-bottom: 15px;">✅ Найденные аккаунты</h3>
                    ${found.map(r => `
                        <a href="${r.url}" target="_blank" class="social-card found">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-found">Найден</span>
                        </a>
                    `).join('')}
                ` : ''}
                
                ${notFound.length > 0 ? `
                    <h3 style="color: #f56565; margin: 20px 0 15px;">❌ Не найдены</h3>
                    ${notFound.map(r => `
                        <div class="social-card not-found">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-not-found">Не найден</span>
                        </div>
                    `).join('')}
                ` : ''}
                
                ${unknown.length > 0 ? `
                    <h3 style="color: #ed8936; margin: 20px 0 15px;">❓ Требуют ручной проверки</h3>
                    ${unknown.map(r => `
                        <a href="${r.url}" target="_blank" class="social-card unknown">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-unknown">Проверить</span>
                        </a>
                    `).join('')}
                ` : ''}
            `;
            
            document.getElementById('result').classList.add('active');
        }

        // Обработчик Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchAccounts();
            });
        });
    </script>
</body>
</html>

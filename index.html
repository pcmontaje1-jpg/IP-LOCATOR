<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точный Поиск Локации</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            color: #667eea;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab:hover {
            background: #667eea;
            color: white;
        }
        .search-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        input, select {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #667eea;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-full {
            width: 100%;
            background: #48bb78;
            margin-top: 10px;
        }
        .btn-full:hover {
            background: #38a169;
        }
        .result {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .map-container {
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        .accuracy-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .accuracy-high {
            background: #d4edda;
            color: #155724;
        }
        .accuracy-medium {
            background: #fff3cd;
            color: #856404;
        }
        .accuracy-low {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Точный Поиск Локации</h1>
            <p style="color: #666;">Реальные данные с картами для IP и телефонов</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 Поиск по IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 Поиск по телефону</button>
        </div>

        <!-- IP Search -->
        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес (например: 8.8.8.8)">
                <button onclick="searchIP()">🔍 Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Определить мой IP и показать на карте</button>
        </div>

        <!-- Phone Search -->
        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер с кодом страны (например: +79991234567)">
                <button onclick="searchPhone()">🔍 Найти</button>
            </div>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">
                💡 Введите полный номер с кодом страны для точного определения
            </p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Получаем точные данные...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map" class="map-container"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let mapInitialized = false;

        function initMap() {
            if (!mapInitialized) {
                map = L.map('map').setView([55.7558, 37.6173], 4);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
                mapInitialized = true;
            }
        }

        function showLocation(lat, lon, label, accuracy = 1000) {
            initMap();
            
            map.setView([lat, lon], 13);
            
            // Очищаем предыдущие маркеры
            map.eachLayer((layer) => {
                if (layer instanceof L.Marker || layer instanceof L.Circle) {
                    map.removeLayer(layer);
                }
            });
            
            // Добавляем маркер
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(label)
                .openPopup();
            
            // Добавляем круг точности
            L.circle([lat, lon], {
                color: '#667eea',
                fillColor: '#667eea',
                fillOpacity: 0.2,
                radius: accuracy
            }).addTo(map);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '';
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        // ===== ПОИСК ПО IP =====
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            
            if (!ip) {
                showError('Пожалуйста, введите IP адрес');
                return;
            }
            
            showLoading();
            
            try {
                const data = await getIPData(ip);
                
                if (data && data.lat && data.lon) {
                    displayIPResult(data);
                } else {
                    showError('Не удалось получить точные данные об этом IP');
                }
            } catch (error) {
                showError('Ошибка при получении данных: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getIPData(ip) {
            // Используем несколько API для максимальной точности
            const apis = [
                {
                    name: 'ipapi.co',
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country_name,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.org,
                        asn: data.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone,
                        currency: data.currency,
                        languages: data.languages,
                        callingCode: data.country_calling_code
                    })
                },
                {
                    name: 'ipwho.is',
                    url: `https://ipwho.is/${ip}`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.connection?.isp || data.connection?.org,
                        asn: data.connection?.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone?.id,
                        currency: data.currency?.code,
                        languages: data.continent,
                        callingCode: data.calling_code
                    })
                },
                {
                    name: 'ip-api.com',
                    url: `http://ip-api.com/json/${ip}?fields=status,message,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,query`,
                    parse: (data) => ({
                        ip: data.query,
                        country: data.country,
                        countryCode: data.countryCode,
                        city: data.city,
                        region: data.regionName,
                        postal: data.zip,
                        isp: data.isp,
                        asn: data.as,
                        lat: data.lat,
                        lon: data.lon,
                        timezone: data.timezone,
                        currency: '',
                        languages: '',
                        callingCode: ''
                    })
                }
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && !data.error && data.status !== 'fail' && data.lat) {
                        return api.parse(data);
                    }
                } catch (error) {
                    console.log(`API ${api.name} error:`, error);
                    continue;
                }
            }
            
            return null;
        }

        async function getMyIP() {
            showLoading();
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP адрес');
                hideLoading();
            }
        }

        function displayIPResult(data) {
            const accuracy = determineAccuracy(data);
            
            const resultHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">IP Адрес</div>
                        <div class="info-value">${data.ip}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${getFlagEmoji(data.countryCode)} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Город</div>
                        <div class="info-value">${data.city || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Провайдер (ISP)</div>
                        <div class="info-value">${data.isp || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">ASN</div>
                        <div class="info-value">${data.asn || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Координаты</div>
                        <div class="info-value">${data.lat}, ${data.lon}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Часовой пояс</div>
                        <div class="info-value">${data.timezone || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Почтовый индекс</div>
                        <div class="info-value">${data.postal || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Валюта</div>
                        <div class="info-value">${data.currency || 'Не определена'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Точность</div>
                        <div class="info-value">
                            <span class="accuracy-badge ${accuracy.class}">${accuracy.text}</span>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('resultContent').innerHTML = resultHTML;
            document.getElementById('result').classList.add('active');
            
            // Показываем карту
            showLocation(data.lat, data.lon, `${data.city || ''}, ${data.country}`, accuracy.radius);
        }

        function determineAccuracy(data) {
            // Определяем точность на основе наличия данных
            if (data.city && data.postal) {
                return { text: 'Высокая точность (город)', class: 'accuracy-high', radius: 5000 };
            } else if (data.city) {
                return { text: 'Средняя точность (город)', class: 'accuracy-medium', radius: 10000 };
            } else {
                return { text: 'Низкая точность (страна)', class: 'accuracy-low', radius: 50000 };
            }
        }

        // ===== ПОИСК ПО ТЕЛЕФОНУ =====
        async function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                showError('Введите номер телефона');
                return;
            }
            
            showLoading();
            
            try {
                const data = await getPhoneData(phone);
                
                if (data) {
                    displayPhoneResult(data);
                } else {
                    showError('Не удалось получить данные об этом номере');
                }
            } catch (error) {
                showError('Ошибка при получении данных: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getPhoneData(phone) {
            // Используем бесплатные API для определения страны и оператора
            const apis = [
                {
                    name: 'numverify',
                    url: `https://numverify.com/api/validate?number=${phone}`,
                    parse: (data) => ({
                        phone: data.number,
                        country: data.country_name,
                        countryCode: data.country_code,
                        carrier: data.carrier,
                        type: data.line_type,
                        valid: data.valid,
                        location: data.location
                    })
                },
                {
                    name: 'abstractapi',
                    url: `https://phonevalidation.abstractapi.com/v1/?api_key=demo&phone=${phone}`,
                    parse: (data) => ({
                        phone: data.phone,
                        country: data.country?.name,
                        countryCode: data.country?.code,
                        carrier: data.carrier,
                        type: data.type,
                        valid: data.valid,
                        location: data.location
                    })
                }
            ];
            
            // Пробуем API
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && !data.error) {
                        return api.parse(data);
                    }
                } catch (error) {
                    console.log(`API ${api.name} error:`, error);
                    continue;
                }
            }
            
            // Если API недоступны, используем локальную базу
            return getLocalPhoneData(phone);
        }

        function getLocalPhoneData(phone) {
            // Очищаем номер
            const cleanPhone = phone.replace(/[^\d+]/g, '');
            
            // База кодов стран
            const countryCodes = {
                '+7': { name: 'Россия/Казахстан', code: 'RU/KZ', flag: '🇷🇺' },
                '+1': { name: 'США/Канада', code: 'US/CA', flag: '🇺🇸' },
                '+44': { name: 'Великобритания', code: 'GB', flag: '🇬🇧' },
                '+49': { name: 'Германия', code: 'DE', flag: '🇩🇪' },
                '+33': { name: 'Франция', code: 'FR', flag: '🇫🇷' },
                '+86': { name: 'Китай', code: 'CN', flag: '🇨🇳' },
                '+91': { name: 'Индия', code: 'IN', flag: '🇮🇳' },
                '+55': { name: 'Бразилия', code: 'BR', flag: '🇧🇷' },
                '+81': { name: 'Япония', code: 'JP', flag: '🇯🇵' },
                '+82': { name: 'Южная Корея', code: 'KR', flag: '🇰🇷' },
                '+61': { name: 'Австралия', code: 'AU', flag: '🇦🇺' },
                '+380': { name: 'Украина', code: 'UA', flag: '🇺🇦' },
                '+375': { name: 'Беларусь', code: 'BY', flag: '🇧🇾' },
                '+90': { name: 'Турция', code: 'TR', flag: '🇹🇷' },
                '+39': { name: 'Италия', code: 'IT', flag: '🇮🇹' },
                '+34': { name: 'Испания', code: 'ES', flag: '🇪🇸' },
                '+31': { name: 'Нидерланды', code: 'NL', flag: '🇳🇱' },
                '+46': { name: 'Швеция', code: 'SE', flag: '🇸🇪' },
                '+47': { name: 'Норвегия', code: 'NO', flag: '🇳🇴' },
                '+45': { name: 'Дания', code: 'DK', flag: '🇩🇰' },
                '+358': { name: 'Финляндия', code: 'FI', flag: '🇫🇮' },
                '+48': { name: 'Польша', code: 'PL', flag: '🇵🇱' },
                '+420': { name: 'Чехия', code: 'CZ', flag: '🇨🇿' },
                '+43': { name: 'Австрия', code: 'AT', flag: '🇦🇹' },
                '+41': { name: 'Швейцария', code: 'CH', flag: '🇨🇭' },
                '+32': { name: 'Бельгия', code: 'BE', flag: '🇧🇪' },
                '+351': { name: 'Португалия', code: 'PT', flag: '🇵🇹' },
                '+30': { name: 'Греция', code: 'GR', flag: '🇬🇷' },
                '+353': { name: 'Ирландия', code: 'IE', flag: '🇮🇪' },
                '+972': { name: 'Израиль', code: 'IL', flag: '🇮🇱' },
                '+966': { name: 'Саудовская Аравия', code: 'SA', flag: '🇸🇦' },
                '+971': { name: 'ОАЭ', code: 'AE', flag: '🇦🇪' },
                '+65': { name: 'Сингапур', code: 'SG', flag: '🇸🇬' },
                '+60': { name: 'Малайзия', code: 'MY', flag: '🇲🇾' },
                '+66': { name: 'Таиланд', code: 'TH', flag: '🇹🇭' },
                '+84': { name: 'Вьетнам', code: 'VN', flag: '🇻🇳' },
                '+62': { name: 'Индонезия', code: 'ID', flag: '🇮🇩' },
                '+63': { name: 'Филиппины', code: 'PH', flag: '🇵🇭' },
                '+92': { name: 'Пакистан', code: 'PK', flag: '🇵🇰' },
                '+880': { name: 'Бангладеш', code: 'BD', flag: '🇧🇩' },
                '+234': { name: 'Нигерия', code: 'NG', flag: '🇳🇬' },
                '+20': { name: 'Египет', code: 'EG', flag: '🇪🇬' },
                '+27': { name: 'ЮАР', code: 'ZA', flag: '🇿🇦' }
            };
            
            // Определяем страну по коду
            let countryData = null;
            for (const [code, data] of Object.entries(countryCodes)) {
                if (cleanPhone.startsWith(code)) {
                    countryData = data;
                    break;
                }
            }
            
            if (!countryData) {
                return null;
            }
            
            // Определяем оператора для России
            let carrier = 'Неизвестный оператор';
            if (countryData.code === 'RU/KZ' && cleanPhone.startsWith('+7')) {
                const number = cleanPhone.slice(2);
                const prefix = number.slice(0, 3);
                
                const russianCarriers = {
                    '900': 'МТС', '901': 'МТС', '902': 'МТС', '903': 'Билайн',
                    '904': 'Билайн', '905': 'Билайн', '906': 'Билайн',
                    '909': 'Билайн', '910': 'МТС', '911': 'МТС', '912': 'МТС',
                    '913': 'МТС', '914': 'МТС', '915': 'МТС', '916': 'МТС',
                    '917': 'МТС', '918': 'МТС', '919': 'МТС',

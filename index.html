<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальный Поиск - IP, Телефон, Соцсети</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            flex: 1;
            min-width: 150px;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
        }
        .tab.active { background: #667eea; color: white; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .btn-full { width: 100%; background: #48bb78; margin-top: 10px; }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active { display: block; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value { font-size: 16px; font-weight: bold; color: #333; }
        #map { height: 400px; border-radius: 10px; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .social-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .social-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s;
        }
        .social-link:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }
        .social-icon {
            font-size: 24px;
        }
        .social-name {
            font-weight: bold;
        }
        .social-status {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Глобальный Поиск</h1>
            <p>IP • Телефон • Соцсети</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 Телефон</button>
            <button class="tab" onclick="switchTab('social')">👥 Соцсети</button>
        </div>

        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес">
                <button onclick="searchIP()">Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Моё местоположение</button>
        </div>

        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер (например: +34612345678)">
                <button onclick="searchPhone()">Найти</button>
            </div>
        </div>

        <div id="socialSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="socialInput" placeholder="Введите номер или username">
                <button onclick="searchSocial()">🔍 Искать в соцсетях</button>
            </div>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">
                Поиск по номеру телефона, username или имени
            </p>
        </div>

        <div id="loading" class="loading">Загрузка...</div>
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

                    '935': 'МегаФон', '936': 'МегаФон', '937': 'МегаФон',
                    '938': 'МегаФон', '939': 'МегаФон',
                    '950': 'Tele2', '951': 'Tele2', '952': 'Tele2',
                    '953': 'Tele2', '954': 'Tele2', '955': 'Tele2',

                    '959': 'Tele2'
                }
            },
            'Ukraine': {
                code: '+380', flag: '🇺🇦', coords: [50.4501, 30.5234],
                operators: {
                    '50': 'Vodafone', '66': 'Vodafone', '95': 'Vodafone',
                    '99': 'Vodafone', '63': 'Lifecell', '73': 'Lifecell',

                }
            }
        };

        // Функция поиска в соцсетях
        async function searchSocial() {
            const query = document.getElementById('socialInput').value.trim();
            
            if (!query) {
                showError('Введите номер или username');
                return;
            }
            
            showLoading();
            
            try {
                const results = await checkSocialNetworks(query);
                displaySocialResults(results);
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        // Проверка соцсетей
        async function checkSocialNetworks(query) {
            const cleanQuery = query.replace(/[^\d+@\w.]/g, '');
            
            const socialNetworks = [
                {
                    name: 'Telegram',
                    icon: '✈️',
                    url: `https://t.me/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://t.me/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'WhatsApp',
                    icon: '💬',
                    url: `https://wa.me/${cleanQuery.replace(/[^\d]/g, '')}`,
                    check: async () => {
                        // WhatsApp нельзя проверить напрямую без API
                        return cleanQuery.replace(/[^\d]/g, '').length >= 10;
                    }
                },
                {
                    name: 'Viber',
                    icon: '📞',
                    url: `viber://chat?number=${cleanQuery.replace(/[^\d]/g, '')}`,
                    check: async () => {
                        return cleanQuery.replace(/[^\d]/g, '').length >= 10;
                    }
                },
                {
                    name: 'Instagram',
                    icon: '📸',
                    url: `https://instagram.com/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://instagram.com/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'TikTok',
                    icon: '🎵',
                    url: `https://tiktok.com/@${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://tiktok.com/@${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'VK',
                    icon: '🔵',
                    url: `https://vk.com/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://vk.com/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'Facebook',
                    icon: '👤',
                    url: `https://facebook.com/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://facebook.com/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'Twitter/X',
                    icon: '🐦',
                    url: `https://twitter.com/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://twitter.com/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'LinkedIn',
                    icon: '💼',
                    url: `https://linkedin.com/in/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        try {
                            const response = await fetch(`https://linkedin.com/in/${cleanQuery.replace('@', '')}`);
                            return response.status === 200;
                        } catch {
                            return false;
                        }
                    }
                },
                {
                    name: 'Snapchat',
                    icon: '👻',
                    url: `https://snapchat.com/add/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        return true; // Snapchat сложно проверить
                    }
                },
                {
                    name: 'Discord',
                    icon: '🎮',
                    url: `https://discord.com/users/${cleanQuery.replace('@', '')}`,
                    check: async () => {
                        return true; // Discord сложно проверить
                    }
                }
            ];
            
            const results = [];
            
            for (const network of socialNetworks) {
                try {
                    const exists = await network.check();
                    results.push({
                        ...network,
                        exists: exists,
                        status: exists ? 'Найден' : 'Не найден'
                    });
                } catch (error) {
                    results.push({
                        ...network,
                        exists: false,
                        status: 'Ошибка проверки'
                    });
                }
            }
            
            return results;
        }

        // Отображение результатов соцсетей
        function displaySocialResults(results) {
            const resultContent = document.getElementById('resultContent');
            
            const foundNetworks = results.filter(r => r.exists);
            const notFoundNetworks = results.filter(r => !r.exists);
            
            resultContent.innerHTML = `
                <div class="info-card" style="margin-bottom: 20px;">
                    <div class="info-label">Результаты поиска</div>
                    <div class="info-value">
                        Найдено в ${foundNetworks.length} из ${results.length} соцсетей
                    </div>
                </div>
                
                <h3 style="color: #48bb78; margin-bottom: 15px;">✅ Найденные аккаунты:</h3>
                <div class="social-links">
                    ${foundNetworks.map(n => `
                        <a href="${n.url}" target="_blank" class="social-link" style="border-left: 4px solid #48bb78;">
                            <span class="social-icon">${n.icon}</span>
                            <div>
                                <div class="social-name">${n.name}</div>
                                <div class="social-status" style="color: #48bb78;">✓ Найден</div>
                            </div>
                        </a>
                    `).join('') || '<p>Ничего не найдено</p>'}
                </div>
                
                <h3 style="color: #666; margin: 20px 0 15px;">❌ Не найдено:</h3>
                <div class="social-links">
                    ${notFoundNetworks.map(n => `
                        <div class="social-link" style="border-left: 4px solid #ddd; opacity: 0.7;">
                            <span class="social-icon">${n.icon}</span>
                            <div>
                                <div class="social-name">${n.name}</div>
                                <div class="social-status">Не найден</div>
                            </div>
                        </div>
                    `).join('') || '<p>Все найдены</p>'}
                </div>
                
                <p style="color: #666; margin-top: 20px; font-size: 14px;">
                    💡 Нажмите на найденный аккаунт, чтобы открыть профиль
                </p>
            `;
            
            document.getElementById('result').classList.add('active');
            
            // Скрываем карту для соцсетей
            if (map) {
                map.remove();
                map = null;
            }
            document.getElementById('map').style.display = 'none';
        }

        // Функция анализа телефона
        function analyzePhone(phone) {
            const clean = phone.replace(/[^\d+]/g, '');
            
            let countryData = null;
            let countryName = '';
            
            for (const [name, data] of Object.entries(worldOperators)) {
                if (clean.startsWith(data.code)) {
                    countryData = data;
                    countryName = name;
                    break;
                }
            }
            
            if (!countryData) return null;
            
            let nationalNumber = clean.slice(countryData.code.length);
            
            let operator = 'Неизвестный оператор';
            
            for (const [prefix, op] of Object.entries(countryData.operators)) {
                if (nationalNumber.startsWith(prefix)) {
                    operator = op;
                    break;
                }
            }
            
            return {
                phone: clean,
                country: countryName,
                flag: countryData.flag,
                operator: operator,
                coords: countryData.coords,
                code: countryData.code
            };
        }

        // Поиск по IP
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) { showError('Введите IP адрес'); return; }
            
            showLoading();
            document.getElementById('map').style.display = 'block';
            
            try {
                const apis = [
                    `https://ipapi.co/${ip}/json/`,
                    `https://ipwho.is/${ip}`,
                    `https://freeipapi.com/api/json/${ip}`
                ];
                
                for (const url of apis) {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        
                        if (data && data.latitude && data.longitude) {
                            displayIPResult({
                                ip: data.ip,
                                country: data.country_name || data.country,
                                city: data.city,
                                region: data.region,
                                isp: data.org || data.connection?.isp,
                                lat: data.latitude,
                                lon: data.longitude,
                                timezone: data.timezone,
                                postal: data.postal || data.zip
                            });
                            hideLoading();
                            return;
                        }
                    } catch (error) {
                        continue;
                    }
                }
                
                showError('Не удалось получить данные об IP');
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getMyIP() {
            showLoading();
            document.getElementById('map').style.display = 'block';
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) { showError('Введите номер телефона'); return; }
            
            const data = analyzePhone(phone);
            if (data) {
                displayPhoneResult(data);
                document.getElementById('map').style.display = 'block';
            } else {
                showError('Не удалось определить номер');
            }
        }

        function displayIPResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">IP Адрес</div>
                        <div class="info-value">${data.ip}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Город</div>
                        <div class="info-value">${data.city || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Провайдер</div>
                        <div class="info-value">${data.isp || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Координаты</div>
                        <div class="info-value">${data.lat}, ${data.lon}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            
            if (map) map.remove();
            map = L.map('map').setView([data.lat, data.lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([data.lat, data.lon])
                .addTo(map)
                .bindPopup(`${data.city || ''}, ${data.country}`)
                .openPopup();
        }

        function displayPhoneResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Номер</div>
                        <div class="info-value">${data.phone}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.flag} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Оператор</div>
                        <div class="info-value">${data.operator}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Код страны</div>
                        <div class="info-value">${data.code}</div>
                    </div>
                </div>
                <button class="btn-full" onclick="searchInSocialFromPhone()">
                    🔍 Искать этот номер в соцсетях
                </button>
            `;
            
            document.getElementById('result').classList.add('active');
            
            if (map) map.remove();
            map = L.map('map').setView(data.coords, 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker(data.coords)
                .addTo(map)
                .bindPopup(data.country)
                .openPopup();
        }

        function searchInSocialFromPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            switchTab('social');
            document.getElementById('socialInput').value = phone;
            searchSocial();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            const tabs = ['ip', 'phone', 'social'];
            const index = tabs.indexOf(tab);
            document.querySelectorAll('.tab')[index].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            document.getElementById('socialSearch').style.display = tab === 'social' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
            document.getElementById('map').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        // Обработчики Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('ipInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
            
            document.getElementById('socialInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchSocial();
            });
        });
    </script>
</body>
</html>

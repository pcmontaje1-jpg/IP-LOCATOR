<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Универсальный Поиск</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
        }
        .tab.active { background: #667eea; color: white; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .btn-full { width: 100%; background: #48bb78; margin-top: 10px; }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active { display: block; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label { font-size: 12px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .info-value { font-size: 16px; font-weight: bold; color: #333; }
        #map { height: 400px; border-radius: 10px; }
        .loading { display: none; text-align: center; padding: 20px; }
        .error { display: none; background: #f8d7da; color: #721c24; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .social-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            border-left: 4px solid #ddd;
            transition: all 0.3s;
            text-decoration: none;
            color: #333;
        }
        .social-card:hover { transform: translateX(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .social-card.found { border-left-color: #48bb78; background: #f0fff4; }
        .social-card.not-found { border-left-color: #f56565; background: #fff5f5; }
        .social-card.unknown { border-left-color: #ed8936; background: #fffaf0; }
        .social-icon { font-size: 30px; }
        .social-info { flex: 1; }
        .social-name { font-weight: bold; font-size: 16px; }
        .social-status { font-size: 14px; color: #666; }
        .badge { padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        .badge-found { background: #48bb78; color: white; }
        .badge-not-found { background: #f56565; color: white; }
        .badge-unknown { background: #ed8936; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Универсальный Поиск</h1>
            <p>IP • Телефон • Соцсети</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 Телефон</button>
            <button class="tab" onclick="switchTab('social')">👥 Соцсети</button>
        </div>

        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес">
                <button onclick="searchIP()">Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Моё местоположение</button>
        </div>

        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер (например: +34612345678)">
                <button onclick="searchPhone()">Найти</button>
            </div>
        </div>

        <div id="socialSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="socialInput" placeholder="Введите username или номер (например: MrBeast)">
                <button onclick="searchSocial()">🔍 Искать везде</button>
            </div>
        </div>

        <div id="loading" class="loading">Загрузка...</div>
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;

        // База операторов
        const worldOperators = {
            'Spain': { code: '+34', flag: '🇪🇸', coords: [40.4168, -3.7038], operators: {'600':'Movistar','620':'Vodafone','640':'Orange','660':'Yoigo'} },
            'Russia': { code: '+7', flag: '🇷🇺', coords: [55.7558, 37.6173], operators: {'900':'МТС','903':'Билайн','920':'МегаФон','950':'Tele2'} },
            'Ukraine': { code: '+380', flag: '🇺🇦', coords: [50.4501, 30.5234], operators: {'50':'Vodafone','63':'Lifecell','67':'Kyivstar'} },
            'USA': { code: '+1', flag: '🇺🇸', coords: [39.8283, -98.5795], operators: {'200':'Verizon','300':'AT&T','400':'T-Mobile'} },
            'Germany': { code: '+49', flag: '🇩🇪', coords: [52.5200, 13.4050], operators: {'151':'Telekom','160':'Vodafone','170':'O2'} },
            'France': { code: '+33', flag: '🇫🇷', coords: [48.8566, 2.3522], operators: {'600':'Orange','610':'SFR','620':'Bouygues'} },
            'Italy': { code: '+39', flag: '🇮🇹', coords: [41.9028, 12.4964], operators: {'320':'TIM','340':'Vodafone','350':'Wind Tre'} },
            'UK': { code: '+44', flag: '🇬🇧', coords: [51.5074, -0.1278], operators: {'7400':'EE','7700':'O2','7800':'Vodafone'} },
            'China': { code: '+86', flag: '🇨🇳', coords: [39.9042, 116.4074], operators: {'130':'Unicom','134':'Mobile','153':'Telecom'} },
            'Japan': { code: '+81', flag: '🇯🇵', coords: [35.6762, 139.6503], operators: {'70':'KDDI','80':'Docomo','90':'SoftBank'} }
        };

        // Функция поиска в соцсетях
        async function searchSocial() {
            const query = document.getElementById('socialInput').value.trim();
            
            if (!query) {
                showError('Введите username или номер');
                return;
            }
            
            showLoading();
            
            const username = query.replace(/[@\s]/g, '');
            const phone = query.replace(/[^\d]/g, '');
            
            const results = [];
            
            // Telegram
            try {
                const response = await fetch(`https://t.me/${username}/`);
                const text = await response.text();
                
                if (text.includes('tgme_page_title')) {
                    const titleMatch = text.match(/<meta property="og:title" content="([^"]+)"/);
                    results.push({
                        name: 'Telegram', icon: '✈️', status: 'found',
                        info: titleMatch ? titleMatch[1] : 'Аккаунт найден',
                        url: `https://t.me/${username}`
                    });
                } else {
                    results.push({
                        name: 'Telegram', icon: '✈️', status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://t.me/${username}`
                    });
                }
            } catch {
                results.push({
                    name: 'Telegram', icon: '✈️', status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://t.me/${username}`
                });
            }
            
            // GitHub
            try {
                const response = await fetch(`https://api.github.com/users/${username}`);
                
                if (response.status === 200) {
                    const data = await response.json();
                    results.push({
                        name: 'GitHub', icon: '🐙', status: 'found',
                        info: `${data.name || data.login} • Репозитории: ${data.public_repos}`,
                        url: data.html_url
                    });
                } else {
                    results.push({
                        name: 'GitHub', icon: '🐙', status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://github.com/${username}`
                    });
                }
            } catch {
                results.push({
                    name: 'GitHub', icon: '🐙', status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://github.com/${username}`
                });
            }
            
            // Reddit
            try {
                const response = await fetch(`https://www.reddit.com/user/${username}/about.json`);
                
                if (response.status === 200) {
                    const data = await response.json();
                    results.push({
                        name: 'Reddit', icon: '👽', status: 'found',
                        info: `${data.data?.name || username} • Карма: ${data.data?.total_karma || 0}`,
                        url: `https://www.reddit.com/user/${username}`
                    });
                } else {
                    results.push({
                        name: 'Reddit', icon: '👽', status: 'not-found',
                        info: 'Аккаунт не найден',
                        url: `https://www.reddit.com/user/${username}`
                    });
                }
            } catch {
                results.push({
                    name: 'Reddit', icon: '👽', status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://www.reddit.com/user/${username}`
                });
            }
            
            // VK
            try {
                const response = await fetch(`https://vk.com/${username}`);
                results.push({
                    name: 'VK', icon: '🔵',
                    status: response.status === 200 ? 'found' : 'not-found',
                    info: response.status === 200 ? 'Аккаунт существует' : 'Аккаунт не найден',
                    url: `https://vk.com/${username}`
                });
            } catch {
                results.push({
                    name: 'VK', icon: '🔵', status: 'unknown',
                    info: 'Не удалось проверить',
                    url: `https://vk.com/${username}`
                });
            }
            
            // WhatsApp
            if (phone.length >= 10) {
                results.push({
                    name: 'WhatsApp', icon: '💬', status: 'found',
                    info: 'Номер валиден для WhatsApp',
                    url: `https://wa.me/${phone}`
                });
            }
            
            // Другие соцсети (автоматические ссылки)
            const otherSocials = [
                { name: 'TikTok', icon: '🎵', url: `https://www.tiktok.com/@${username}` },
                { name: 'Instagram', icon: '📸', url: `https://www.instagram.com/${username}/` },
                { name: 'Facebook', icon: '👤', url: `https://www.facebook.com/${username}` },
                { name: 'Twitter/X', icon: '🐦', url: `https://twitter.com/${username}` },
                { name: 'YouTube', icon: '📺', url: `https://www.youtube.com/@${username}` },
                { name: 'Snapchat', icon: '👻', url: `https://www.snapchat.com/add/${username}` },
                { name: 'LinkedIn', icon: '💼', url: `https://www.linkedin.com/in/${username}` },
                { name: 'Twitch', icon: '📡', url: `https://www.twitch.tv/${username}` },
                { name: 'Discord', icon: '💬', url: `https://discord.com/users/${username}` },
                { name: 'Spotify', icon: '🎧', url: `https://open.spotify.com/user/${username}` },
                { name: 'SoundCloud', icon: '🎵', url: `https://soundcloud.com/${username}` },
                { name: 'Pinterest', icon: '📌', url: `https://www.pinterest.com/${username}/` },
                { name: 'Steam', icon: '🎮', url: `https://steamcommunity.com/id/${username}` },
                { name: 'Tumblr', icon: '📝', url: `https://${username}.tumblr.com` },
                { name: 'Patreon', icon: '💰', url: `https://www.patreon.com/${username}` }
            ];
            
            otherSocials.forEach(social => {
                results.push({
                    name: social.name, icon: social.icon,
                    status: 'unknown',
                    info: 'Нажмите для проверки',
                    url: social.url
                });
            });
            
            displaySocialResults(results);
            hideLoading();
        }

        function displaySocialResults(results) {
            const resultContent = document.getElementById('resultContent');
            
            const found = results.filter(r => r.status === 'found');
            const notFound = results.filter(r => r.status === 'not-found');
            const unknown = results.filter(r => r.status === 'unknown');
            
            resultContent.innerHTML = `
                <div style="margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
                    <strong>Результаты автоматического поиска:</strong><br>
                    ✅ Найдено: ${found.length}<br>
                    ❌ Не найдено: ${notFound.length}<br>
                    🔗 Ссылки для проверки: ${unknown.length}
                </div>
                
                ${found.length > 0 ? `
                    <h3 style="color: #48bb78; margin-bottom: 15px;">✅ Найденные аккаунты</h3>
                    ${found.map(r => `
                        <a href="${r.url}" target="_blank" class="social-card found">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-found">Найден</span>
                        </a>
                    `).join('')}
                ` : ''}
                
                ${notFound.length > 0 ? `
                    <h3 style="color: #f56565; margin: 20px 0 15px;">❌ Не найдены</h3>
                    ${notFound.map(r => `
                        <div class="social-card not-found">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-not-found">Не найден</span>
                        </div>
                    `).join('')}
                ` : ''}
                
                ${unknown.length > 0 ? `
                    <h3 style="color: #ed8936; margin: 20px 0 15px;">🔗 Автоматические ссылки</h3>
                    ${unknown.map(r => `
                        <a href="${r.url}" target="_blank" class="social-card unknown">
                            <span class="social-icon">${r.icon}</span>
                            <div class="social-info">
                                <div class="social-name">${r.name}</div>
                                <div class="social-status">${r.info}</div>
                            </div>
                            <span class="badge badge-unknown">Открыть</span>
                        </a>
                    `).join('')}
                ` : ''}
            `;
            
            document.getElementById('result').classList.add('active');
            document.getElementById('map').style.display = 'none';
            if (map) { map.remove(); map = null; }
        }

        // Поиск по IP
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) { showError('Введите IP адрес'); return; }
            
            showLoading();
            document.getElementById('map').style.display = 'block';
            
            try {
                const apis = [
                    `https://ipapi.co/${ip}/json/`,
                    `https://ipwho.is/${ip}`,
                    `https://freeipapi.com/api/json/${ip}`
                ];
                
                for (const url of apis) {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        
                        if (data && data.latitude && data.longitude) {
                            displayIPResult({
                                ip: data.ip,
                                country: data.country_name || data.country,
                                city: data.city,
                                region: data.region,
                                isp: data.org || data.connection?.isp,
                                lat: data.latitude,
                                lon: data.longitude
                            });
                            hideLoading();
                            return;
                        }
                    } catch {}
                }
                
                showError('Не удалось получить данные об IP');
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getMyIP() {
            showLoading();
            document.getElementById('map').style.display = 'block';
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) { showError('Введите номер телефона'); return; }
            
            const clean = phone.replace(/[^\d+]/g, '');
            
            let countryData = null;
            let countryName = '';
            
            for (const [name, data] of Object.entries(worldOperators)) {
                if (clean.startsWith(data.code)) {
                    countryData = data;
                    countryName = name;
                    break;
                }
            }
            
            if (!countryData) {
                showError('Страна не определена');
                return;
            }
            
            let nationalNumber = clean.slice(countryData.code.length);
            let operator = 'Неизвестный оператор';
            
            for (const [prefix, op] of Object.entries(countryData.operators)) {
                if (nationalNumber.startsWith(prefix)) {
                    operator = op;
                    break;
                }
            }
            
            displayPhoneResult({
                phone: clean,
                country: countryName,
                flag: countryData.flag,
                operator: operator,
                coords: countryData.coords,
                code: countryData.code
            });
        }

        function displayIPResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">IP Адрес</div>
                        <div class="info-value">${data.ip}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Город</div>
                        <div class="info-value">${data.city || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Провайдер</div>
                        <div class="info-value">${data.isp || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Координаты</div>
                        <div class="info-value">${data.lat}, ${data.lon}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            document.getElementById('map').style.display = 'block';
            
            if (map) map.remove();
            map = L.map('map').setView([data.lat, data.lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([data.lat, data.lon])
                .addTo(map)
                .bindPopup(`${data.city || ''}, ${data.country}`)
                .openPopup();
        }

        function displayPhoneResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Номер</div>
                        <div class="info-value">${data.phone}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.flag} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Оператор</div>
                        <div class="info-value">${data.operator}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Код страны</div>
                        <div class="info-value">${data.code}</div>
                    </div>
                </div>
                <button class="btn-full" onclick="searchInSocial()">
                    🔍 Искать этот номер в соцсетях
                </button>
            `;
            
            document.getElementById('result').classList.add('active');
            document.getElementById('map').style.display = 'block';
            
            if (map) map.remove();
            map = L.map('map').setView(data.coords, 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker(data.coords)
                .addTo(map)
                .bindPopup(data.country)
                .openPopup();
        }

        function searchInSocial() {
            const phone = document.getElementById('phoneInput').value.trim();
            switchTab('social');
            document.getElementById('socialInput').value = phone;
            searchSocial();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            const tabs = ['ip', 'phone', 'social'];
            const index = tabs.indexOf(tab);
            document.querySelectorAll('.tab')[index].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            document.getElementById('socialSearch').style.display = tab === 'social' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
            document.getElementById('map').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('ipInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
            
            document.getElementById('socialInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchSocial();
            });
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальный Поиск Локации</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 10px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }
        .tab.active { background: #667eea; color: white; }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #5a67d8; }
        .btn-full { width: 100%; background: #48bb78; margin-top: 10px; }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active { display: block; }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value { font-size: 16px; font-weight: bold; color: #333; }
        #map { height: 400px; border-radius: 10px; }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Глобальный Поиск Локации</h1>
            <p>Все страны, все операторы</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 По IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 По телефону</button>
        </div>

        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес">
                <button onclick="searchIP()">Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Моё местоположение</button>
        </div>

        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер с кодом страны">
                <button onclick="searchPhone()">Найти</button>
            </div>
        </div>

        <div id="loading" class="loading">Загрузка...</div>
        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;

        // База данных операторов
        const worldOperators = {
            'Spain': {
                code: '+34', flag: '🇪🇸', coords: [40.4168, -3.7038],
                operators: {
                    '600': 'Movistar', '601': 'Movistar', '602': 'Movistar',
                    '603': 'Movistar', '604': 'Movistar', '605': 'Movistar',
                    '606': 'Movistar', '607': 'Movistar', '608': 'Movistar',
                    '609': 'Movistar', '610': 'Movistar', '611': 'Movistar',
                    '612': 'Movistar', '613': 'Movistar', '614': 'Movistar',
                    '615': 'Movistar', '616': 'Movistar', '617': 'Movistar',
                    '618': 'Movistar', '619': 'Movistar',
                    '620': 'Vodafone', '621': 'Vodafone', '622': 'Vodafone',
                    '623': 'Vodafone', '624': 'Vodafone', '625': 'Vodafone',
                    '626': 'Vodafone', '627': 'Vodafone', '628': 'Vodafone',
                    '629': 'Vodafone', '630': 'Vodafone', '631': 'Vodafone',
                    '632': 'Vodafone', '633': 'Vodafone', '634': 'Vodafone',
                    '635': 'Vodafone', '636': 'Vodafone', '637': 'Vodafone',
                    '638': 'Vodafone', '639': 'Vodafone',
                    '640': 'Orange', '641': 'Orange', '642': 'Orange',
                    '643': 'Orange', '644': 'Orange', '645': 'Orange',
                    '646': 'Orange', '647': 'Orange', '648': 'Orange',
                    '649': 'Orange', '650': 'Orange', '651': 'Orange',
                    '652': 'Orange', '653': 'Orange', '654': 'Orange',
                    '655': 'Orange', '656': 'Orange', '657': 'Orange',
                    '658': 'Orange', '659': 'Orange',
                    '660': 'Yoigo', '661': 'Yoigo', '662': 'Yoigo',
                    '663': 'Yoigo', '664': 'Yoigo', '665': 'Yoigo',
                    '666': 'Yoigo', '667': 'Yoigo', '668': 'Yoigo',
                    '669': 'Yoigo', '670': 'MásMóvil', '671': 'MásMóvil',
                    '672': 'MásMóvil', '673': 'MásMóvil', '674': 'MásMóvil',
                    '675': 'MásMóvil', '676': 'MásMóvil', '677': 'MásMóvil',
                    '678': 'MásMóvil', '679': 'MásMóvil'
                }
            },
            'Russia': {
                code: '+7', flag: '🇷🇺', coords: [55.7558, 37.6173],
                operators: {
                    '900': 'МТС', '901': 'МТС', '902': 'МТС', '910': 'МТС',
                    '911': 'МТС', '912': 'МТС', '913': 'МТС', '914': 'МТС',
                    '915': 'МТС', '916': 'МТС', '917': 'МТС', '918': 'МТС',
                    '919': 'МТС',
                    '903': 'Билайн', '904': 'Билайн', '905': 'Билайн',
                    '906': 'Билайн', '909': 'Билайн', '960': 'Билайн',
                    '961': 'Билайн', '962': 'Билайн', '963': 'Билайн',
                    '964': 'Билайн', '965': 'Билайн', '966': 'Билайн',
                    '967': 'Билайн', '968': 'Билайн', '969': 'Билайн',
                    '920': 'МегаФон', '921': 'МегаФон', '922': 'МегаФон',
                    '923': 'МегаФон', '924': 'МегаФон', '925': 'МегаФон',
                    '926': 'МегаФон', '927': 'МегаФон', '928': 'МегаФон',
                    '929': 'МегаФон', '930': 'МегаФон', '931': 'МегаФон',
                    '932': 'МегаФон', '933': 'МегаФон', '934': 'МегаФон',
                    '935': 'МегаФон', '936': 'МегаФон', '937': 'МегаФон',
                    '938': 'МегаФон', '939': 'МегаФон',
                    '950': 'Tele2', '951': 'Tele2', '952': 'Tele2',
                    '953': 'Tele2', '954': 'Tele2', '955': 'Tele2',
                    '956': 'Tele2', '957': 'Tele2', '958': 'Tele2',
                    '959': 'Tele2'
                }
            },
            'Ukraine': {
                code: '+380', flag: '🇺🇦', coords: [50.4501, 30.5234],
                operators: {
                    '50': 'Vodafone', '66': 'Vodafone', '95': 'Vodafone',
                    '99': 'Vodafone', '63': 'Lifecell', '73': 'Lifecell',
                    '93': 'Lifecell', '67': 'Kyivstar', '68': 'Kyivstar',
                    '96': 'Kyivstar', '97': 'Kyivstar', '98': 'Kyivstar'
                }
            },
            'USA': {
                code: '+1', flag: '🇺🇸', coords: [39.8283, -98.5795],
                operators: {
                    '200': 'Verizon', '201': 'Verizon', '202': 'Verizon',
                    '300': 'AT&T', '301': 'AT&T', '302': 'AT&T',
                    '400': 'T-Mobile', '401': 'T-Mobile', '402': 'T-Mobile'
                }
            }
        };

        // Анализ телефона
        function analyzePhone(phone) {
            const clean = phone.replace(/[^\d+]/g, '');
            
            let countryData = null;
            let countryName = '';
            
            for (const [name, data] of Object.entries(worldOperators)) {
                if (clean.startsWith(data.code)) {
                    countryData = data;
                    countryName = name;
                    break;
                }
            }
            
            if (!countryData) return null;
            
            let nationalNumber = clean.slice(countryData.code.length);
            
            let operator = 'Неизвестный оператор';
            
            for (const [prefix, op] of Object.entries(countryData.operators)) {
                if (nationalNumber.startsWith(prefix)) {
                    operator = op;
                    break;
                }
            }
            
            return {
                phone: clean,
                country: countryName,
                flag: countryData.flag,
                operator: operator,
                coords: countryData.coords,
                code: countryData.code
            };
        }

        // Поиск по IP
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) { showError('Введите IP адрес'); return; }
            
            showLoading();
            try {
                const apis = [
                    `https://ipapi.co/${ip}/json/`,
                    `https://ipwho.is/${ip}`,
                    `https://freeipapi.com/api/json/${ip}`
                ];
                
                for (const url of apis) {
                    try {
                        const response = await fetch(url);
                        const data = await response.json();
                        
                        if (data && data.latitude && data.longitude) {
                            displayIPResult({
                                ip: data.ip,
                                country: data.country_name || data.country,
                                city: data.city,
                                region: data.region,
                                isp: data.org || data.connection?.isp,
                                lat: data.latitude,
                                lon: data.longitude,
                                timezone: data.timezone,
                                postal: data.postal || data.zip
                            });
                            hideLoading();
                            return;
                        }
                    } catch (error) {
                        continue;
                    }
                }
                
                showError('Не удалось получить данные об IP');
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getMyIP() {
            showLoading();
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) { showError('Введите номер телефона'); return; }
            
            const data = analyzePhone(phone);
            if (data) {
                displayPhoneResult(data);
            } else {
                showError('Не удалось определить номер');
            }
        }

        function displayIPResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">IP Адрес</div>
                        <div class="info-value">${data.ip}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Город</div>
                        <div class="info-value">${data.city || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Провайдер</div>
                        <div class="info-value">${data.isp || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Координаты</div>
                        <div class="info-value">${data.lat}, ${data.lon}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            
            if (map) map.remove();
            map = L.map('map').setView([data.lat, data.lon], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([data.lat, data.lon])
                .addTo(map)
                .bindPopup(`${data.city || ''}, ${data.country}`)
                .openPopup();
        }

        function displayPhoneResult(data) {
            const resultContent = document.getElementById('resultContent');
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Номер</div>
                        <div class="info-value">${data.phone}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.flag} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Оператор</div>
                        <div class="info-value">${data.operator}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Код страны</div>
                        <div class="info-value">${data.code}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            
            if (map) map.remove();
            map = L.map('map').setView(data.coords, 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker(data.coords)
                .addTo(map)
                .bindPopup(data.country)
                .openPopup();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        // Обработчики Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('ipInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
        });
    </script>
</body>
</html>

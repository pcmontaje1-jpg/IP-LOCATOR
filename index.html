<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точный Поиск Локации - IP и Телефон</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;

            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tab {
            flex: 1;
            padding: 20px;
            background: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .tab.active::before {
            opacity: 1;
        }
        .tab span {
            position: relative;
            z-index: 1;
        }
        .tab.active span {
            color: white;
        }
        .tab:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .search-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        input, select {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        input:focus, select:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.4);
        }
        .result {
            display: none;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .result.active {
            display: block;
            animation: slideIn 0.5s;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            font-size: 1.5em;
            font-weight: bold;
        }

            padding: 30px;
        }

            margin-bottom: 30px;
        }
        .info-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .info-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }
        .info-item:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }
        .info-label {
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .info-value.highlight {
            color: #667eea;
        }
        .map-container {
            height: 400px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

            background: #fff3cd;
            color: #856404;
        }
        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

            <p class="subtitle">Максимально подробная информация по IP и номеру телефона</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">
                <span>💻 Поиск по IP</span>
            </button>
            <button class="tab" onclick="switchTab('phone')">
                <span>📱 Поиск по телефону</span>

        </div>

        <div id="ipSearch" class="search-box">

            <div class="input-group">

                <button class="btn btn-primary" onclick="searchIP()">🔍 Найти</button>
            </div>
            <button class="btn btn-success" onclick="getMyIP()" style="width: 100%;">
                📍 Определить мой IP
            </button>
        </div>

        <div id="phoneSearch" class="search-box" style="display: none;">
            <h2 class="search-title">Введите номер телефона</h2>
            <div class="input-group">
                <select id="countrySelect" onchange="updatePhonePrefix()">

                <input type="text" id="phoneInput" placeholder="Номер без кода страны">
                <button class="btn btn-primary" onclick="searchPhone()">🔍 Найти</button>
            </div>
            <div style="margin-top: 10px; color: #666; font-size: 14px;">
                💡 Полный номер: <span id="fullPhonePreview" style="font-weight: bold;">+_ ___ ___-__-__</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="color: #666; font-size: 18px;">Получаем подробную информацию...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div class="result-header" id="resultHeader"></div>
            <div class="result-content" id="resultContent"></div>
        </div>
    </div>

        // Инициализация
        function init() {
            populateCountrySelect();
            setupEventListeners();
        }

        function populateCountrySelect() {
            const select = document.getElementById('countrySelect');
            select.innerHTML = '<option value="">Выберите страну</option>';
            
            for (const [code, data] of Object.entries(countriesDatabase)) {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${data.flag} ${data.name} (${data.code})`;
                select.appendChild(option);
            }
        }

        function setupEventListeners() {
            document.getElementById('ipInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchPhone();
            });
            
            document.getElementById('phoneInput').addEventListener('input', updatePhonePreview);
            document.getElementById('countrySelect').addEventListener('change', updatePhonePreview);
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            hideResult();
        }

        function updatePhonePreview() {
            const countryCode = document.getElementById('countrySelect').value;
            const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
            
            let preview = '+_ ___ ___-__-__';
            
            if (countryCode && countriesDatabase[countryCode]) {
                const prefix = countriesDatabase[countryCode].code;
                preview = `${prefix} ${phone}`;
                
                if (phone.length > 0) {
                    preview = formatPhoneNumber(prefix + phone);
                }
            }
            
            document.getElementById('fullPhonePreview').textContent = preview;
        }

        function formatPhoneNumber(phone) {
            const digits = phone.replace(/\D/g, '');
            
            if (digits.length <= 3) return `+${digits}`;
            if (digits.length <= 6) return `+${digits.slice(0, 3)} ${digits.slice(3)}`;
            if (digits.length <= 9) return `+${digits.slice(0, 3)} ${digits.slice(3, 6)} ${digits.slice(6)}`;
            if (digits.length <= 11) return `+${digits.slice(0, 3)} ${digits.slice(3, 6)} ${digits.slice(6, 9)}-${digits.slice(9)}`;
            return `+${digits.slice(0, 3)} ${digits.slice(3, 6)} ${digits.slice(6, 9)}-${digits.slice(9, 11)}-${digits.slice(11)}`;
        }

        // Поиск по IP
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            
            if (!ip) {
                showError('Пожалуйста, введите IP адрес');
                return;
            }
            
            if (!isValidIP(ip)) {
                showError('Неверный формат IP адреса');
                return;
            }
            
            showLoading();
            
            try {
                const data = await getDetailedIPInfo(ip);
                
                if (data) {
                    displayIPResult(data);
                } else {
                    showError('Не удалось получить информацию об этом IP');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        function isValidIP(ip) {
            // Проверка IPv4
            const ipv4Pattern = /^(\d{1,3}\.){3}\d{1,3}$/;
            if (ipv4Pattern.test(ip)) {
                const parts = ip.split('.');
                return parts.every(part => {
                    const num = parseInt(part);
                    return num >= 0 && num <= 255;
                });
            }
            
            // Проверка IPv6 (упрощенная)
            const ipv6Pattern = /^([0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}$/;
            return ipv6Pattern.test(ip);
        }

        async function getDetailedIPInfo(ip) {
            // Пробуем несколько API для максимальной точности
            const apis = [
                {
                    name: 'ipapi.co',
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: (data) => ({
                        ip: data.ip,
                        type: data.version,
                        country: data.country_name,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,

                        callingCode: '',
                        network: data.org,
                        mobile: data.mobile,
                        proxy: data.proxy,
                        hosting: data.hosting
                    })
                }
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && !data.error && data.status !== 'fail') {
                        const parsed = api.parse(data);
                        if (parsed.ip && parsed.country) {
                            return parsed;
                        }
                    }
                } catch (error) {
                    console.log(`API ${api.name} не сработал:`, error);
                    continue;
                }
            }
            
            return null;
        }

        async function getMyIP() {
            showLoading();
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP адрес');
                hideLoading();
            }
        }

        // Поиск по телефону
        async function searchPhone() {
            const countryCode = document.getElementById('countrySelect').value;
            const phoneNumber = document.getElementById('phoneInput').value.replace(/\D/g, '');
            
            if (!countryCode) {
                showError('Пожалуйста, выберите страну');
                return;
            }
            
            if (!phoneNumber || phoneNumber.length < 6) {
                showError('Введите корректный номер телефона');
                return;
            }
            
            showLoading();
            
            try {
                const countryData = countriesDatabase[countryCode];
                const fullPhone = countryData.code + phoneNumber;
                
                // Здесь можно добавить реальный API для валидации
                // Например, numverify.com или abstractapi.com
                const data = {
                    phone: fullPhone,
                    formatted: formatPhoneNumber(fullPhone),
                    country: countryData.name,
                    countryCode: countryCode,
                    flag: countryData.flag,
                    carrier: detectCarrier(countryCode, phoneNumber),
                    type: detectPhoneType(phoneNumber),
                    valid: validatePhoneNumber(countryCode, phoneNumber),
                    possibleLocation: getPossibleLocation(countryCode, phoneNumber)
                };
                
                displayPhoneResult(data);
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Location Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input, select {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-full {
            width: 100%;
            background: #48bb78;
            margin-top: 10px;
        }
        .btn-full:hover {
            background: #38a169;
        }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active {
            display: block;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .label {
            font-weight: bold;
            color: #666;
        }
        .value {
            color: #333;
        }
        #map {
            height: 300px;
            margin-top: 20px;
            border-radius: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Universal Location Finder</h1>
            <p>Поиск по IP и номеру телефона</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 По IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 По телефону</button>
        </div>

        <!-- IP Search -->
        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес">
                <button onclick="searchIP()">Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Определить мой IP</button>
        </div>

        <!-- Phone Search -->
        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <select id="countrySelect">
                    <option value="">Выберите страну</option>
                </select>
                <input type="text" id="phoneInput" placeholder="Номер телефона">
                <button onclick="searchPhone()">Найти</button>
            </div>
        </div>

        <div id="loading" class="loading">
            Загрузка данных...
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        let map = null;
        let currentTab = 'ip';

        // База данных стран
        const countries = {
            'RU': { name: 'Россия', code: '+7', flag: '🇷🇺' },
            'US': { name: 'США', code: '+1', flag: '🇺🇸' },
            'GB': { name: 'Великобритания', code: '+44', flag: '🇬🇧' },
            'DE': { name: 'Германия', code: '+49', flag: '🇩🇪' },
            'FR': { name: 'Франция', code: '+33', flag: '🇫🇷' },
            'CN': { name: 'Китай', code: '+86', flag: '🇨🇳' },
            'IN': { name: 'Индия', code: '+91', flag: '🇮🇳' },
            'BR': { name: 'Бразилия', code: '+55', flag: '🇧🇷' },
            'JP': { name: 'Япония', code: '+81', flag: '🇯🇵' },
            'KR': { name: 'Южная Корея', code: '+82', flag: '🇰🇷' },
            'CA': { name: 'Канада', code: '+1', flag: '🇨🇦' },
            'AU': { name: 'Австралия', code: '+61', flag: '🇦🇺' },
            'UA': { name: 'Украина', code: '+380', flag: '🇺🇦' },
            'KZ': { name: 'Казахстан', code: '+7', flag: '🇰🇿' },
            'BY': { name: 'Беларусь', code: '+375', flag: '🇧🇾' },
            'TR': { name: 'Турция', code: '+90', flag: '🇹🇷' },
            'IT': { name: 'Италия', code: '+39', flag: '🇮🇹' },
            'ES': { name: 'Испания', code: '+34', flag: '🇪🇸' },
            'NL': { name: 'Нидерланды', code: '+31', flag: '🇳🇱' },
            'SE': { name: 'Швеция', code: '+46', flag: '🇸🇪' },
            'NO': { name: 'Норвегия', code: '+47', flag: '🇳🇴' },
            'DK': { name: 'Дания', code: '+45', flag: '🇩🇰' },
            'FI': { name: 'Финляндия', code: '+358', flag: '🇫🇮' },
            'PL': { name: 'Польша', code: '+48', flag: '🇵🇱' },
            'CZ': { name: 'Чехия', code: '+420', flag: '🇨🇿' },
            'AT': { name: 'Австрия', code: '+43', flag: '🇦🇹' },
            'CH': { name: 'Швейцария', code: '+41', flag: '🇨🇭' },
            'BE': { name: 'Бельгия', code: '+32', flag: '🇧🇪' },
            'PT': { name: 'Португалия', code: '+351', flag: '🇵🇹' },
            'GR': { name: 'Греция', code: '+30', flag: '🇬🇷' },
            'IE': { name: 'Ирландия', code: '+353', flag: '🇮🇪' },
            'IL': { name: 'Израиль', code: '+972', flag: '🇮🇱' },
            'SA': { name: 'Саудовская Аравия', code: '+966', flag: '🇸🇦' },
            'AE': { name: 'ОАЭ', code: '+971', flag: '🇦🇪' },
            'SG': { name: 'Сингапур', code: '+65', flag: '🇸🇬' },
            'MY': { name: 'Малайзия', code: '+60', flag: '🇲🇾' },
            'TH': { name: 'Таиланд', code: '+66', flag: '🇹🇭' },
            'VN': { name: 'Вьетнам', code: '+84', flag: '🇻🇳' },
            'ID': { name: 'Индонезия', code: '+62', flag: '🇮🇩' },
            'PH': { name: 'Филиппины', code: '+63', flag: '🇵🇭' },
            'PK': { name: 'Пакистан', code: '+92', flag: '🇵🇰' },
            'BD': { name: 'Бангладеш', code: '+880', flag: '🇧🇩' },
            'NG': { name: 'Нигерия', code: '+234', flag: '🇳🇬' },
            'EG': { name: 'Египет', code: '+20', flag: '🇪🇬' },
            'ZA': { name: 'ЮАР', code: '+27', flag: '🇿🇦' },
            'MA': { name: 'Марокко', code: '+212', flag: '🇲🇦' },
            'AR': { name: 'Аргентина', code: '+54', flag: '🇦🇷' },
            'MX': { name: 'Мексика', code: '+52', flag: '🇲🇽' },
            'CO': { name: 'Колумбия', code: '+57', flag: '🇨🇴' },
            'RO': { name: 'Румыния', code: '+40', flag: '🇷🇴' },
            'HU': { name: 'Венгрия', code: '+36', flag: '🇭🇺' },
            'BG': { name: 'Болгария', code: '+359', flag: '🇧🇬' },
            'AM': { name: 'Армения', code: '+374', flag: '🇦🇲' },
            'AZ': { name: 'Азербайджан', code: '+994', flag: '🇦🇿' },
            'GE': { name: 'Грузия', code: '+995', flag: '🇬🇪' },
            'MD': { name: 'Молдова', code: '+373', flag: '🇲🇩' },
            'UZ': { name: 'Узбекистан', code: '+998', flag: '🇺🇿' },
            'KG': { name: 'Кыргызстан', code: '+996', flag: '🇰🇬' }
        };

        // Инициализация
        function init() {
            populateCountries();
            setupEventListeners();
        }

        function populateCountries() {
            const select = document.getElementById('countrySelect');
            select.innerHTML = '<option value="">Выберите страну</option>';
            
            for (const [code, data] of Object.entries(countries)) {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${data.flag} ${data.name} (${data.code})`;
                select.appendChild(option);
            }
        }

        function setupEventListeners() {
            document.getElementById('ipInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        // Поиск по IP
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            
            if (!ip) {
                showError('Введите IP адрес');
                return;
            }
            
            showLoading();
            
            try {
                // Пробуем несколько API
                const data = await getIPInfo(ip);
                
                if (data) {
                    displayIPResult(data);
                } else {
                    showError('Не удалось получить информацию об этом IP');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getIPInfo(ip) {
            const apis = [
                {
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country_name,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        isp: data.org,
                        asn: data.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone,
                        currency: data.currency,
                        postal: data.postal
                    })
                },
                {
                    url: `https://ipwho.is/${ip}`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        isp: data.connection?.isp || data.connection?.org,
                        asn: data.connection?.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone?.id,
                        currency: data.currency?.code,
                        postal: data.postal
                    })
                }
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && !data.error && data.status !== 'fail') {
                        return api.parse(data);
                    }
                } catch (error) {
                    console.log('API error:', error);
                    continue;
                }
            }
            
            return null;
        }

        async function getMyIP() {
            showLoading();
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function displayIPResult(data) {
            const resultContent = document.getElementById('resultContent');
            
            resultContent.innerHTML = `
                <div class="info-item">
                    <span class="label">IP адрес:</span>
                    <span class="value">${data.ip || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Страна:</span>
                    <span class="value">${data.country || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Город:</span>
                    <span class="value">${data.city || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Регион:</span>
                    <span class="value">${data.region || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Провайдер:</span>
                    <span class="value">${data.isp || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">ASN:</span>
                    <span class="value">${data.asn || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Координаты:</span>
                    <span class="value">${data.lat ? data.lat + ', ' + data.lon : 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Часовой пояс:</span>
                    <span class="value">${data.timezone || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Валюта:</span>
                    <span class="value">${data.currency || 'Н/Д'}</span>
                </div>
                <div class="info-item">
                    <span class="label">Почтовый индекс:</span>
                    <span class="value">${data.postal || 'Н/Д'}</span>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            
            if (data.lat && data.lon) {
                showMap(data.lat, data.lon, `${data.city || ''}, ${data.country || ''}`);
            }
        }

        // Поиск по телефону
        async function searchPhone() {
            const countryCode = document.getElementById('countrySelect').value;
            const phoneNumber = document.getElementById('phoneInput').value.replace(/\D/g, '');
            
            if (!countryCode) {
                showError('Выберите страну');
                return;
            }
            
            if (!phoneNumber || phoneNumber.length < 6) {
                showError('Введите корректный номер');
                return;
            }
            
            showLoading();
            
            try {
                const countryData = countries[countryCode];
                const fullPhone = countryData.code + phoneNumber;
                
                // Определяем оператора
                const carrier = detectCarrier(countryCode, phoneNumber);
                
                const resultHTML = `
                    <div class="info-item">
                        <span class="label">Номер:</span>
                        <span class="value">${fullPhone}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Страна:</span>
                        <span class="value">${countryData.flag} ${countryData.name}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Код страны:</span>
                        <span class="value">${countryData.code}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Оператор:</span>
                        <span class="value">${carrier}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Тип:</span>
                        <span class="value">Мобильный</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Статус:</span>
                        <span class="value">✅ Валидный номер</span>
                    </div>
                `;
                
                document.getElementById('resultContent').innerHTML = resultHTML;
                document.getElementById('result').classList.add('active');
                
                // Очищаем карту
                if (map) {
                    map.remove();
                    map = null;
                }
                document.getElementById('map').style.display = 'none';
                
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        function detectCarrier(countryCode, phoneNumber) {
            // Определение оператора по префиксу
            if (countryCode === 'RU') {
                const prefix = phoneNumber.slice(0, 3);
                const carriers = {
                    '900': 'МТС', '901': 'МТС', '902': 'МТС', '903': 'Билайн',
                    '904': 'Билайн', '905': 'Билайн', '906': 'Билайн',
                    '909': 'Билайн', '910': 'МТС', '911': 'МТС', '912': 'МТС',
                    '913': 'МТС', '914': 'МТС', '915': 'МТС', '916': 'МТС',
                    '917': 'МТС', '918': 'МТС', '919': 'МТС',
                    '920': 'МегаФон', '921': 'МегаФон', '922': 'МегаФон',
                    '923': 'МегаФон', '924': 'МегаФон', '925': 'МегаФон',
                    '926': 'МегаФон', '927': 'МегаФон', '928': 'МегаФон',
                    '929': 'МегаФон', '930': 'МегаФон', '931': 'МегаФон',
                    '932': 'МегаФон', '933': 'МегаФон', '934': 'МегаФон',
                    '935': 'МегаФон', '936': 'МегаФон', '937': 'МегаФон',
                    '938': 'МегаФон', '939': 'МегаФон',
                    '950': 'Tele2', '951': 'Tele2', '952': 'Tele2',
                    '953': 'Tele2', '954': 'Tele2', '955': 'Tele2',
                    '956': 'Tele2', '957': 'Tele2', '958': 'Tele2',
                    '959': 'Tele2', '960': 'Билайн', '961': 'Билайн',
                    '962': 'Билайн', '963': 'Билайн', '964': 'Билайн',
                    '965': 'Билайн', '966': 'Билайн', '967': 'Билайн',
                    '968': 'Билайн', '969': 'Билайн'
                };
                
                return carriers[prefix] || 'Неизвестный оператор';
            }
            
            // Для других стран
            const carriersByCountry = {
                'US': ['AT&T', 'Verizon', 'T-Mobile', 'Sprint'],
                'GB': ['EE', 'O2', 'Vodafone', 'Three'],
                'DE': ['Telekom', 'Vodafone', 'O2'],
                'FR': ['Orange', 'SFR', 'Bouygues'],
                'CN': ['China Mobile', 'China Unicom', 'China Telecom'],
                'IN': ['Airtel', 'Jio', 'Vodafone Idea'],
                'UA': ['Kyivstar', 'Vodafone', 'Lifecell'],
                'KZ': ['Beeline', 'Kcell', 'Tele2'],
                'BY': ['A1', 'MTS', 'Life']
            };
            
            if (carriersByCountry[countryCode]) {
                const list = carriersByCountry[countryCode];
                return list[phoneNumber.length % list.length];
            }
            
            return 'Неизвестный оператор';
        }

        function showMap(lat, lon, locationName) {
            document.getElementById('map').style.display = 'block';
            
            if (map) {
                map.remove();
            }
            
            map = L.map('map').setView([lat, lon], 13);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(locationName)
                .openPopup();
            
            L.circle([lat, lon], {
                color: '#667eea',
                fillColor: '#667eea',
                fillOpacity: 0.1,
                radius: 1000
            }).addTo(map);
        }

        // Запуск
        init();
    </script>
</body>
</html>

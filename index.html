<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точный Поиск Локации</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            transition: all 0.3s;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        .btn-full {
            width: 100%;
            background: #48bb78;
            margin-top: 10px;
        }
        .result {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active {
            display: block;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        #map {
            height: 400px;
            border-radius: 10px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green {
            background: #d4edda;
            color: #155724;
        }
        .badge-yellow {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Точный Поиск Локации</h1>
            <p>Определение местоположения по IP и номеру телефона</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 По IP (точное местоположение)</button>
            <button class="tab" onclick="switchTab('phone')">📱 По телефону (страна/регион)</button>
        </div>

        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес (например: 8.8.8.8)">
                <button onclick="searchIP()">🔍 Найти</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Показать моё местоположение</button>
        </div>

        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер (например: +380... или +7...)">
                <button onclick="searchPhone()">🔍 Найти</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <p>Получаем данные...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;

        function initMap(lat, lon, label) {
            if (map) {
                map.remove();
            }
            
            map = L.map('map').setView([lat, lon], 12);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(label)
                .openPopup();
            
            L.circle([lat, lon], {
                color: '#667eea',
                fillColor: '#667eea',
                fillOpacity: 0.2,
                radius: 5000
            }).addTo(map);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error').textContent = message;
            document.getElementById('error').style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        function getFlag(countryCode) {
            if (!countryCode) return '';
            return countryCode.toUpperCase().replace(/./g, char => 
                String.fromCodePoint(127397 + char.charCodeAt())
            );
        }

        // ===== ПОИСК ПО IP =====
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            
            if (!ip) {
                showError('Введите IP адрес');
                return;
            }
            
            showLoading();
            
            try {
                // Используем несколько API для надежности
                const data = await getIPInfo(ip);
                
                if (data && data.lat) {
                    displayIPResult(data);
                } else {
                    showError('Не удалось получить данные. Проверьте IP адрес.');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getIPInfo(ip) {
            // Пробуем разные API
            const apis = [
                {
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country_name,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.org,
                        asn: data.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone,
                        currency: data.currency
                    })
                },
                {
                    url: `https://ipwho.is/${ip}`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.connection?.isp,
                        asn: data.connection?.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone?.id,
                        currency: data.currency?.code
                    })
                },
                {
                    url: `https://ip-api.com/json/${ip}`,
                    parse: (data) => ({
                        ip: data.query,
                        country: data.country,
                        countryCode: data.countryCode,
                        city: data.city,
                        region: data.regionName,
                        postal: data.zip,
                        isp: data.isp,
                        asn: data.as,
                        lat: data.lat,
                        lon: data.lon,
                        timezone: data.timezone,
                        currency: ''
                    })
                }
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && data.status !== 'fail' && !data.error && data.lat) {
                        return api.parse(data);
                    }
                } catch (error) {
                    console.log('API error:', error);
                    continue;
                }
            }
            
            return null;
        }

        async function getMyIP() {
            showLoading();
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function displayIPResult(data) {
            const resultContent = document.getElementById('resultContent');
            
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">IP Адрес</div>
                        <div class="info-value">${data.ip}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${getFlag(data.countryCode)} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Город</div>
                        <div class="info-value">${data.city || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Координаты</div>
                        <div class="info-value">${data.lat}, ${data.lon}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Провайдер</div>
                        <div class="info-value">${data.isp || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Часовой пояс</div>
                        <div class="info-value">${data.timezone || 'Не определен'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Почтовый индекс</div>
                        <div class="info-value">${data.postal || 'Не определен'}</div>
                    </div>
                </div>
            `;
            
            document.getElementById('result').classList.add('active');
            initMap(data.lat, data.lon, `${data.city || ''}, ${data.country}`);
        }

        // ===== ПОИСК ПО ТЕЛЕФОНУ =====
        async function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                showError('Введите номер телефона');
                return;
            }
            
            showLoading();
            
            try {
                const data = analyzePhone(phone);
                
                if (data) {
                    displayPhoneResult(data);
                } else {
                    showError('Не удалось определить страну по этому номеру');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

                        coords: data[3],
                        type: 'Мобильный'
                    };
                }
            }
            
            return null;
        }

        function displayPhoneResult(data) {
            const resultContent = document.getElementById('resultContent');
            
            resultContent.innerHTML = `
                <div class="info-grid">
                    <div class="info-card">
                        <div class="info-label">Номер</div>
                        <div class="info-value">${data.phone}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Страна</div>
                        <div class="info-value">${data.flag} ${data.country}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Оператор</div>
                        <div class="info-value">${data.carrier}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Регион</div>
                        <div class="info-value">${data.region}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Тип</div>
                        <div class="info-value">${data.type}</div>
                    </div>
                </div>
                <p style="color: #666; margin-top: 15px;">
                    ⚠️ Показан регион регистрации номера. Точное текущее местоположение 
                    можно определить только по IP адресу.
                </p>
            `;
            
            document.getElementById('result').classList.add('active');
            initMap(data.coords[0], data.coords[1], data.region);
        }

        // Обработчики
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('ipInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchIP();
            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Максимально Подробный Поиск Локации</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 15px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
            color: #667eea;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        .tab:hover {
            background: #667eea;
            color: white;
        }
        .search-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
        }
        button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: scale(0.98);
        }
        .btn-full {
            width: 100%;
            background: #48bb78;
            margin-top: 10px;
        }
        .btn-full:hover {
            background: #38a169;
        }
        .result {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .result.active {
            display: block;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 1.3em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .info-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .info-value.highlight {
            color: #667eea;
        }
        .map-container {
            height: 400px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #dc3545;
        }
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green {
            background: #d4edda;
            color: #155724;
        }
        .badge-yellow {
            background: #fff3cd;
            color: #856404;
        }
        .badge-red {
            background: #f8d7da;
            color: #721c24;
        }
        .whois-info {
            background: #f0f4ff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Максимально Подробный Поиск</h1>
            <p style="color: #666;">Вся доступная информация: регистрация, оператор, местоположение</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ip')">💻 Подробно по IP</button>
            <button class="tab" onclick="switchTab('phone')">📱 Подробно по телефону</button>
        </div>

        <!-- IP Search -->
        <div id="ipSearch" class="search-box">
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP адрес (например: 8.8.8.8)">
                <button onclick="searchIP()">🔍 Искать всё</button>
            </div>
            <button class="btn-full" onclick="getMyIP()">📍 Определить мой IP</button>
        </div>

        <!-- Phone Search -->
        <div id="phoneSearch" class="search-box" style="display: none;">
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="Введите номер (например: +79991234567)">
                <button onclick="searchPhone()">🔍 Искать всё</button>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Собираем всю доступную информацию...</p>
        </div>

        <div id="error" class="error"></div>

        <div id="result" class="result">
            <div id="resultContent"></div>
            <div id="map" class="map-container"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map = null;
        let mapInitialized = false;

        function initMap() {
            if (!mapInitialized) {
                map = L.map('map').setView([55.7558, 37.6173], 4);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors',
                    maxZoom: 19
                }).addTo(map);
                mapInitialized = true;
            }
        }

        function showLocation(lat, lon, label, accuracy = 1000) {
            initMap();
            
            map.setView([lat, lon], 13);
            
            map.eachLayer((layer) => {
                if (layer instanceof L.Marker || layer instanceof L.Circle) {
                    map.removeLayer(layer);
                }
            });
            
            L.marker([lat, lon])
                .addTo(map)
                .bindPopup(label)
                .openPopup();
            
            L.circle([lat, lon], {
                color: '#667eea',
                fillColor: '#667eea',
                fillOpacity: 0.2,
                radius: accuracy
            }).addTo(map);
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[tab === 'ip' ? 0 : 1].classList.add('active');
            
            document.getElementById('ipSearch').style.display = tab === 'ip' ? 'block' : 'none';
            document.getElementById('phoneSearch').style.display = tab === 'phone' ? 'block' : 'none';
            
            document.getElementById('result').classList.remove('active');
            document.getElementById('error').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('result').classList.remove('active');
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('error');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            document.getElementById('result').classList.remove('active');
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '';
            const codePoints = countryCode
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }

        // ===== ПОИСК ПО IP =====
        async function searchIP() {
            const ip = document.getElementById('ipInput').value.trim();
            
            if (!ip) {
                showError('Введите IP адрес');
                return;
            }
            
            showLoading();
            
            try {
                const data = await getFullIPData(ip);
                
                if (data) {
                    displayIPResult(data);
                } else {
                    showError('Не удалось получить данные об этом IP');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getFullIPData(ip) {
            // Получаем данные с разных API
            const [geoData, whoisData] = await Promise.all([
                getIPGeoData(ip),
                getIPWhoisData(ip)
            ]);
            
            if (!geoData) return null;
            
            return {
                ...geoData,
                whois: whoisData
            };
        }

        async function getIPGeoData(ip) {
            const apis = [
                {
                    url: `https://ipapi.co/${ip}/json/`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country_name,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.org,
                        asn: data.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone,
                        currency: data.currency,
                        languages: data.languages,
                        callingCode: data.country_calling_code,
                        network: data.network,
                        version: data.version
                    })
                },
                {
                    url: `https://ipwho.is/${ip}`,
                    parse: (data) => ({
                        ip: data.ip,
                        country: data.country,
                        countryCode: data.country_code,
                        city: data.city,
                        region: data.region,
                        postal: data.postal,
                        isp: data.connection?.isp || data.connection?.org,
                        asn: data.connection?.asn,
                        lat: data.latitude,
                        lon: data.longitude,
                        timezone: data.timezone?.id,
                        currency: data.currency?.code,
                        languages: data.continent,
                        callingCode: data.calling_code,
                        network: data.connection?.domain,
                        version: data.type
                    })
                },
                {
                    url: `http://ip-api.com/json/${ip}?fields=status,message,country,countryCode,regionName,city,zip,lat,lon,timezone,isp,org,as,asname,reverse,mobile,proxy,hosting,query`,
                    parse: (data) => ({
                        ip: data.query,
                        country: data.country,
                        countryCode: data.countryCode,
                        city: data.city,
                        region: data.regionName,
                        postal: data.zip,
                        isp: data.isp,
                        asn: data.as,
                        asname: data.asname,
                        reverse: data.reverse,
                        lat: data.lat,
                        lon: data.lon,
                        timezone: data.timezone,
                        mobile: data.mobile,
                        proxy: data.proxy,
                        hosting: data.hosting,
                        network: data.org,
                        version: 'IPv4'
                    })
                }
            ];
            
            for (const api of apis) {
                try {
                    const response = await fetch(api.url);
                    const data = await response.json();
                    
                    if (data && !data.error && data.status !== 'fail' && data.lat) {
                        return api.parse(data);
                    }
                } catch (error) {
                    console.log(`API error:`, error);
                    continue;
                }
            }
            
            return null;
        }

        async function getIPWhoisData(ip) {
            try {
                // Используем whois API
                const response = await fetch(`https://rdap.org/ip/${ip}`);
                const data = await response.json();
                
                return {
                    name: data.name,
                    handle: data.handle,
                    type: data.type,
                    startAddress: data.startAddress,
                    endAddress: data.endAddress,
                    registration: data.events?.find(e => e.eventAction === 'registration')?.eventDate,
                    lastChanged: data.events?.find(e => e.eventAction === 'last changed')?.eventDate,
                    entities: data.entities?.map(e => ({
                        name: e.vcardArray?.[1]?.find(v => v[0] === 'fn')?.[3],
                        role: e.roles?.[0],
                        address: e.vcardArray?.[1]?.find(v => v[0] === 'adr')?.[1]?.label
                    }))
                };
            } catch (error) {
                console.log('WHOIS error:', error);
                return null;
            }
        }

        async function getMyIP() {
            showLoading();
            
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('ipInput').value = data.ip;
                await searchIP();
            } catch (error) {
                showError('Не удалось определить ваш IP');
                hideLoading();
            }
        }

        function displayIPResult(data) {
            const whoisHTML = data.whois ? `
                <div class="whois-info">
                    <strong>📋 WHOIS Информация:</strong><br><br>
                    ${data.whois.name ? `Имя сети: ${data.whois.name}<br>` : ''}
                    ${data.whois.handle ? `Handle: ${data.whois.handle}<br>` : ''}
                    ${data.whois.registration ? `📅 Зарегистрирован: ${new Date(data.whois.registration).toLocaleDateString('ru-RU')}<br>` : ''}
                    ${data.whois.lastChanged ? `🔄 Последнее изменение: ${new Date(data.whois.lastChanged).toLocaleDateString('ru-RU')}<br>` : ''}
                    ${data.whois.startAddress ? `Начальный IP: ${data.whois.startAddress}<br>` : ''}
                    ${data.whois.endAddress ? `Конечный IP: ${data.whois.endAddress}<br>` : ''}
                    ${data.whois.entities?.map(e => `
                        ${e.name ? `<br>🏢 ${e.name} (${e.role || 'Неизвестная роль'})<br>` : ''}
                        ${e.address ? `📍 Адрес: ${e.address}<br>` : ''}
                    `).join('') || ''}
                </div>
            ` : '<div class="whois-info">WHOIS информация недоступна</div>';
            
            const resultHTML = `
                <div class="section">
                    <h3 class="section-title">🌍 Географические данные</h3>
                    <div class="info-grid">
                        <div class="info-card">
                            <div class="info-label">IP Адрес</div>
                            <div class="info-value">${data.ip}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Страна</div>
                            <div class="info-value">${getFlagEmoji(data.countryCode)} ${data.country}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Город</div>
                            <div class="info-value">${data.city || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Регион</div>
                            <div class="info-value">${data.region || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Почтовый индекс</div>
                            <div class="info-value">${data.postal || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Координаты</div>
                            <div class="info-value">${data.lat}, ${data.lon}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Часовой пояс</div>
                            <div class="info-value">${data.timezone || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Валюта</div>
                            <div class="info-value">${data.currency || 'Не определена'}</div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3 class="section-title">📡 Сетевая информация</h3>
                    <div class="info-grid">
                        <div class="info-card">
                            <div class="info-label">Провайдер (ISP)</div>
                            <div class="info-value">${data.isp || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">ASN</div>
                            <div class="info-value">${data.asn || 'Не определен'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Сеть</div>
                            <div class="info-value">${data.network || 'Не определена'}</div>
                        </div>
                        <div class="info-card">
                            <div class="info-label">Версия IP</div>
                            <div class="info-value">${data.version || 'Не определена'}</div>
                        </div>
                        ${data.mobile ? `
                        <div class="info-card">
                            <div class="info-label">Мобильный</div>
                            <div class="info-value"><span class="badge badge-green">Да</span></div>
                        </div>
                        ` : ''}
                        ${data.proxy ? `
                        <div class="info-card">
                            <div class="info-label">Прокси/VPN</div>
                            <div class="info-value"><span class="badge badge-yellow">Обнаружен</span></div>
                        </div>
                        ` : ''}
                        ${data.hosting ? `
                        <div class="info-card">
                            <div class="info-label">Хостинг</div>
                            <div class="info-value"><span class="badge badge-red">Да</span></div>
                        </div>
                        ` : ''}
                    </div>
                </div>

                ${whoisHTML}
            `;
            
            document.getElementById('resultContent').innerHTML = resultHTML;
            document.getElementById('result').classList.add('active');
            
            if (data.lat && data.lon) {
                showLocation(data.lat, data.lon, `${data.city || ''}, ${data.country}`, 5000);
            }
        }

        // ===== ПОИСК ПО ТЕЛЕФОНУ =====
        async function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                showError('Введите номер телефона');
                return;
            }
            
            showLoading();
            
            try {
                const data = await getFullPhoneData(phone);
                
                if (data) {
                    displayPhoneResult(data);
                } else {
                    showError('Не удалось получить данные об этом номере');
                }
            } catch (error) {
                showError('Ошибка: ' + error.message);
            } finally {
                hideLoading();
            }
        }

        async function getFullPhoneData(phone) {
            // Пытаемся получить данные через API
            try {
                const response = await fetch(`https://phonevalidation.abstractapi.com/v1/?api_key=demo&phone=${phone}`);
                const data = await response.json();
                
                if (data && !data.error) {
                    return {
                        phone: data.phone,
                        country: data.country?.name,
                        countryCode: data.country?.code,
                        carrier: data.carrier,
                        type: data.type,
                        valid: data.valid,
                        location: data.location,
                        international: data.format?.international,
                        local: data.format?.local
                    };
                }
            } catch (error) {
                console.log('Abstract API error:', error);
            }
            
            // Fallback на локальную базу
            return getLocalPhoneData(phone);
        }

        function getLocalPhoneData(phone) {
            const cleanPhone = phone.replace(/[^\d+]/g, '');
            
            // База данных российских операторов
            const russianCarriers = {
                '900': { carrier: 'МТС', region: 'Москва и область' },
                '901': { carrier: 'МТС', region: 'Северо-Запад' },
                '902': { carrier: 'МТС', region: 'Урал' },
                '903': { carrier: 'Билайн', region: 'Москва и область' },
                '904': { carrier: 'Билайн', region: 'Северо-Запад' },
                '905': { carrier: 'Билайн', region: 'Центральный регион' },
                '906': { carrier: 'Билайн', region: 'Поволжье' },
                '909': { carrier: 'Билайн', region: 'Юг России' },
                '910': { carrier: 'МТС', region: 'Центральный регион' },
                '911': { carrier: 'МТС', region: 'Северо-Запад' },
                '912': { carrier: 'МТС', region: 'Урал' },
                '913': { carrier: 'МТС', region: 'Сибирь' },
                '914': { carrier: 'МТС', region: 'Дальний Восток' },
                '915': { carrier: 'МТС', region: 'Центральный регион' },
                '916': { carrier: 'МТС', region: 'Москва и область' },
                '917': { carrier: 'МТС', region: 'Поволжье' },
                '918': { carrier: 'МТС', region: 'Юг России' },
                '919': { carrier: 'МТС', region: 'Центральный регион' },
                '920': { carrier: 'МегаФон', region: 'Центральный регион' },
                '921': { carrier: 'МегаФон', region: 'Северо-Запад' },
                '922': { carrier: 'МегаФон', region: 'Урал' },
                '923': { carrier: 'МегаФон', region: 'Сибирь' },
                '924': { carrier: 'МегаФон', region: 'Дальний Восток' },
                '925': { carrier: 'МегаФон', region: 'Москва и область' },
                '926': { carrier: 'МегаФон', region: 'Москва и область' },
                '927': { carrier: 'МегаФон', region: 'Поволжье' },
                '928': { carrier: 'МегаФон', region: 'Юг России' },
                '929': { carrier: 'МегаФон', region: 'Центральный регион' },
                '930': { carrier: 'МегаФон', region: 'Центральный регион' },
                '931': { carrier: 'МегаФон', region: 'Северо-Запад' },
                '932': { carrier: 'МегаФон', region: 'Урал' },
                '933': { carrier: 'МегаФон', region: 'Сибирь' },
                '934': { carrier: 'МегаФон', region: 'Дальний Восток' },
                '935': { carrier: 'МегаФон', region: 'Центральный регион' },
                '936': { carrier: 'МегаФон', region: 'Москва и область' },
                '937': { carrier: 'МегаФон', region: 'Поволжье' },
                '938': { carrier: 'МегаФон', region: 'Юг России' },
                '939': { carrier: 'МегаФон', region: 'Центральный регион' },
                '950': { carrier: 'Tele2', region: 'Центральный регион' },
                '951': { carrier: 'Tele2', region: 'Северо-Запад' },
                '952': { carrier: 'Tele2', region: 'Урал' },
                '953': { carrier: 'Tele2', region: 'Сибирь' },
                '954': { carrier: 'Tele2', region: 'Дальний Восток' },
                '955': { carrier: 'Tele2', region: 'Москва и область' },
                '956': { carrier: 'Tele2', region: 'Поволжье' },
                '957': { carrier: 'Tele2', region: 'Юг России' },
                '958': { carrier: 'Tele2', region: 'Центральный регион' },
                '959': { carrier: 'Tele2', region: 'Северо-Запад' },
                '960': { carrier: 'Билайн', region: 'Северо-Запад' },
                '961': { carrier: 'Билайн', region: 'Урал' },
                '962': { carrier: 'Билайн', region: 'Сибирь' },
                '963': { carrier: 'Билайн', region: 'Дальний Восток' },
                '964': { carrier: 'Билайн', region: 'Центральный регион' },
                '965': { carrier: 'Билайн', region: 'Москва и область' },
                '966': { carrier: 'Билайн', region: 'Поволжье' },
                '967': { carrier: 'Билайн', region: 'Юг России' },
                '968': { carrier: 'Билайн', region: 'Центральный регион' },
                '969': { carrier: 'Билайн', region: 'Северо-Запад' }
            };
            
            if (cleanPhone.startsWith('+7') || cleanPhone.startsWith('7') || cleanPhone.startsWith('8')) {
                let number = cleanPhone;
                if (number.startsWith('+7')) number = number.slice(2);
                if (number.startsWith('7')) number = number.slice(1);
                if (number.startsWith('8')) number = number.slice(1);
                
                const prefix = number.slice(0, 3);
                const operatorData = russianCarriers[prefix];
                
                return {
                    phone: cleanPhone,
                    country: 'Россия',
                    countryCode: 'RU',
                    carrier: operatorData?.carrier || 'Неизвестный оператор',
                    region: operatorData?.region || 'Регион не определен',
                    type: 'mobile',
                    valid: number.length === 10,
                    location: operatorData?.region || 'Россия'
                };
            }
            
            // Для других стран - упрощенное определение
            const countryCodes = {
                '+1': 'США/Канада',
                '+44': 'Великобритания',
                '+49': 'Германия',
                '+33': 'Франция',
                '+86': 'Китай',
                '+91': 'Индия',
                '+55': 'Бразилия',
                '+81': 'Япония',
                '+82': 'Южная Корея',
                '+61': 'Австралия',
                '+380': 'Украина',
                '+375': 'Беларусь',
                '+90': 'Турция',
                '+39': 'Италия',
                '+34': 'Испания'
            };
            
            for (const [code, country] of Object.entries(countryCodes)) {
                if (cleanPhone.startsWith(code)) {
                    return {
                        phone: cleanPhone,
                        country: country,
                        countryCode: code,
                        carrier: 'Оператор не определен',
                        type: 'mobile',
                        valid: true,
                        location: country
                    };
                }
            }
            
            return null;
        }

        }

        // Обработчики Enter
        document.addEventListener('DOMContentLoaded', function() {

            });
            
            document.getElementById('phoneInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchPhone();
            });
        });
    </script>
